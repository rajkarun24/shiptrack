# Whole local environment: api + worker + database + cache + Kafka.
services:
  api:
    build: .
    image: shiptrack:local        # api and worker share ONE image
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      DATABASE_URL: postgresql://shiptrack:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/shiptrack
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully   # topic must exist first

  worker:
    image: shiptrack:local        # same image as the api, different start command
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped       # if it crashes, Docker starts it again
    environment:
      # No API_KEY here: the worker doesn't need it (least privilege)
      DATABASE_URL: postgresql://shiptrack:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/shiptrack
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      api:
        condition: service_started    # makes sure the image is built before the worker starts
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shiptrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shiptrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiptrack -d shiptrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0     # official image, runs in KRaft mode (no ZooKeeper needed)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller           # one node does both jobs (fine locally)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092   # the address clients are told to use
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1        # only one broker, so 1 copy
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"         # topics are created on purpose, below
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"             # keep memory use laptop-friendly
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafkadata:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"                 # runs once, creates the topic, exits
    command: >
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists
      --topic parcel-status --partitions 1 --replication-factor 1
      --bootstrap-server kafka:9092

volumes:
  pgdata:
  kafkadata:
